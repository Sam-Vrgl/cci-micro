spring:
  application:
    name: notification-service
  config:
    import: "optional:configserver:http://localhost:8888"
  datasource:
    url: jdbc:h2:mem:notificationdb;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: update

server:
  port: 8094

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
